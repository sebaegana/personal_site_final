baseURL: 'https://segana.netlify.app'
defaultContentLanguage: en
title: Sebastián Egaña Santibáñez

enableEmoji: true
enableRobotsTXT: true
paginate: 10
summaryLength: 30
removePathAccents: true

theme: blowfish

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

imaging:
  resampleFilter: lanczos
  quality: 75
  anchor: smart

taxonomies:
  tag: tags
  category: categories
